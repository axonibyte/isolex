[package]
name = "isolex-studio-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "What isolex studio does, without a window: the library, its edits and undo, saving, compiling in the background and watching the folder."
authors = ["Axonibyte Innovations, LLC"]
license = "Apache-2.0"
repository = "https://github.com/axonibyte/isolex"
publish = false

[dependencies]
# pure Rust only: this crate is built and tested in the FreeBSD jail,
# where the studio's desktop shell (studio/) is not
isolex = { path = ".." }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
