[package]
name = "isolex-studio-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "What isolex studio does, without a window: the library, its edits and undo, saving, compiling in the background and watching the folder."
authors = ["Axonibyte Innovations, LLC"]
license = "Apache-2.0"
repository = "https://github.com/axonibyte/isolex"
publish = false

[dependencies]
# pure Rust only: this crate is built and tested in the FreeBSD jail,
# where the studio's desktop shell (studio/) is not
isolex = { path = "..", default-features = false }
serde = { version = "1", features = ["derive"] }
# the save journal
serde_json = "1"
# deflating and inflating an exported zip of the library, as isolex's
# font converter does WOFF
miniz_oxide = { version = "0.9", features = ["with-alloc"] }

[dev-dependencies]
serde_json = "1"

[features]
default = ["font-tools"]
# importing and exporting fonts (isolex's converter): the desktop shell
# has it, the WebAssembly module does not
font-tools = ["isolex/font-tools"]
