# reaper tenant: the engine battery. The ubuntu guest builds in a
# digest-pinned toolchain image and runs the seed-driven exerciser (a
# generator emits random valid lexicons with a shadow census; nemesis
# rounds must produce located diagnostics, never panics). The freebsd
# guest is deliberately absent: that template ships no toolchain beyond
# base (reaper's own FreeBSD leg is pure sh for the same reason), and
# FreeBSD-native coverage comes from the development workstation, which
# is FreeBSD and runs the full suite at every commit.

schema = 1
project = "isolex"

guests = ["ubuntu-26.04"]
exec = "container"

[build]
# docker.io/library/rust:1.97, resolved 2026-09-04 — the same toolchain
# the CI pipeline pins.
image = "docker.io/rust@sha256:b1b3c9c0d921d7fa0a6d1f9ec7e4eab87f8c8ec97644c3d791450f131dec813f"
cmd = "CARGO_HOME=$REAPER_CACHE_CARGO CARGO_TARGET_DIR=$REAPER_CACHE_TARGET cargo test --release --locked && CARGO_HOME=$REAPER_CACHE_CARGO CARGO_TARGET_DIR=$REAPER_CACHE_TARGET cargo build --release --locked"
cache = ["cargo", "target"]

[run]
cmd = "ci/battery.sh"

[sync]
exclude = ["/target/"]

[reset]
datasets = ["state"]

[resources]
cores = 4
ram_gb = 8
