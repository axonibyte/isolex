[package]
name = "isolex"
version = "0.3.1"
edition = "2021"
rust-version = "1.97"
description = "A declarative language for icon systems — define glyph families with parameters and prototype inheritance, compile deterministically to vector output."
authors = ["Axonibyte Innovations, LLC"]
license = "Apache-2.0"
repository = "https://github.com/axonibyte/isolex"

[dependencies]
# cos/sin in pure Rust, identical bits on every platform (SPEC §7): no
# arch-specific paths, and no hardware float instructions on the way.
libm = { version = "0.2.16", default-features = false, features = ["force-soft-floats"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# The font converter's, behind the font-tools feature, which only the
# command line's code uses; the WebAssembly module is built without it.
# Both are pure Rust; we take each under Apache-2.0 (NOTICE).
ttf-parser = { version = "0.25", optional = true }
miniz_oxide = { version = "0.9", optional = true, features = ["with-alloc"] }

[features]
default = ["font-tools"]
# `isolex font import` and `isolex font export`
font-tools = ["dep:ttf-parser", "dep:miniz_oxide"]

[dev-dependencies]
# goldens are plain file comparisons; no snapshot framework needed

[profile.release]
lto = true
strip = true

# The compiler as a WebAssembly module (wasm/src/lib.rs). The root package
# stays the default member, so a plain `cargo build` is the CLI alone.
[workspace]
members = ["wasm"]
