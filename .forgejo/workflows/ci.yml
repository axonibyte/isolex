# CI for the Rust group -- bgone, ddwill, isolex, lychgate, reaper.
#
# Ported from rumor's .forgejo/workflows/ci.yml, and the discipline carries over
# whole: ONE FreeBSD job; no actions/checkout; a timeout(1) on every external
# call plus a timeout-minutes backstop; rc 124 reported separately from a
# failure; `set -o pipefail`; redirect-then-read-status rather than a pipe; a
# non-fatal probe first; and every step emitting a value only execution could
# have produced.
#
# THIS ONE RUNS IN THE JAIL, unlike the Java group. Nothing here needs a
# loopback address -- cargo has no daemon -- so freebsd-15-jail is right, and it
# is where rumor's CI already lives.
#
# THE CROSS-TARGETS ARE GONE, and that is a narrowing with a reason. The
# bitbucket pipeline built four: x86_64-unknown-linux-gnu,
# aarch64-unknown-linux-gnu, x86_64-unknown-freebsd and aarch64-unknown-freebsd,
# each through ci/build-target.sh in a rust:1.97 container. The jail's rust comes
# from pkg with NO rustup, and only two target stdlibs are installed --
# x86_64-unknown-freebsd and wasm32 -- so the other three cannot be built here at
# all, and a step that cannot run is worse than an absent one: it reads as a
# pass. cal parked the question 2026-10-20 ("if these are on public repos we
# might have github actions just build them there as well but I haven't decided
# yet"), so this file builds the ONE target this runner can, says so, and leaves
# ci/build-target.sh in the tree for whoever answers that question.
#
# THE OTHER STDLIB IS wasm32-unknown-unknown, and the compiler is built for it
# too: wasm/ is the library as a module that imports nothing, for hosts that
# embed it (bam runs it under wazero). It is target-independent, so it is
# published beside the FreeBSD binaries as isolex-<version>.wasm.
#
# THE PIN IS 1.97 AND THE JAIL HAS 1.98.1, which is why the probe step prints
# what it actually got: a toolchain drift shows up as a changed value rather
# than as a mysterious new clippy failure. `--locked` everywhere keeps
# Cargo.lock authoritative, exactly as the pipeline had it.
name: ci

on:
  push:
    branches: [main]
    # Releases are tagged with the bare version, as 0.1.0 and 0.1.1 were:
    # 0.1.2, never v0.1.2.
    tags: ['[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # NO `permissions:` BLOCK, DELIBERATELY. This forge IGNORES the key, so
    # declaring it states a contract nothing enforces. MEASURED on Forgejo
    # 15.0.9, 2026-10-27: a job declaring `permissions: contents: read` was
    # allowed to CREATE A RELEASE -- a contents write -- and the forge
    # answered 201. An earlier version of this file carried `contents: write`
    # with a comment calling it "a stated contract" so "a step that needs
    # more fails by name instead of succeeding on borrowed reach". That was
    # false in every clause, and a comment asserting a guarantee that does
    # not exist is worse than no comment: it tells the next reader the job is
    # bounded when it is not.
    #
    # Forgejo's position is that the automatic token carries repository
    # access and is not configurable per job (forgejo#6904, closed by
    # design). Authorized Integrations in 16.0 are the supported way to ask
    # for more; this forge runs 15.0.9 and does not have them.
    runs-on: freebsd-15-jail
    timeout-minutes: 45
    steps:
      - name: probe the runner (non-fatal; names what is absent)
        run: |
          set -o pipefail
          echo "runner: $(uname -srm)"
          for t in git cargo rustc; do
            p=$(command -v "$t" 2>/dev/null) || p=""
            if [ -n "$p" ]; then echo "$t: $p"; else echo "$t: ABSENT"; fi
          done
          timeout 30 rustc -V || echo "rustc: did not answer in 30s"
          timeout 30 cargo -V || echo "cargo: did not answer in 30s"
          echo "installed target stdlibs: $(ls /usr/local/lib/rustlib 2>/dev/null | tr '\n' ' ')"

      - name: fetch the tree with git, not a JS action
        run: |
          set -o pipefail
          # The full ref the event names: refs/heads/main, refs/tags/<tag>,
          # or refs/pull/<n>/head. A pull request's short ref name is just
          # its number, which `clone --branch` cannot find.
          ref="${GITHUB_REF:-refs/heads/main}"
          rc=0
          git init --quiet src &&
            timeout 180 git -C src fetch --quiet --depth 1 \
              "${GITHUB_SERVER_URL:-https://forge.axonibyte.com}/${GITHUB_REPOSITORY}.git" \
              "$ref" > clone.log 2>&1 &&
            git -C src checkout --quiet --detach FETCH_HEAD >> clone.log 2>&1 || rc=$?
          if [ "$rc" = 124 ]; then echo "fetching $ref did not answer in 180s"; exit 1; fi
          if [ "$rc" != 0 ]; then echo "fetching $ref failed rc=$rc"; tail -5 clone.log; exit 1; fi
          echo "ref: $ref HEAD: $(git -C src rev-parse --short HEAD)"
          crate=$(sed -n 's/^name *= *"\(.*\)"/\1/p' src/Cargo.toml | head -1)
          ver=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src/Cargo.toml | head -1)
          echo "crate: $crate version: $ver"

      - name: dependencies, from the lockfile and nowhere else
        run: |
          set -o pipefail
          cd src
          rc=0
          timeout 600 cargo fetch --locked > ../fetch.log 2>&1 || rc=$?
          if [ "$rc" = 124 ]; then echo "cargo fetch did not answer in 600s"; exit 1; fi
          [ "$rc" = 0 ] || { echo "cargo fetch rc=$rc"; tail -10 ../fetch.log; exit 1; }
          echo "crates in the lockfile: $(grep -c '^\[\[package\]\]' Cargo.lock)"

      - name: the workspace never resolves the studio's desktop crates
        run: |
          set -o pipefail
          cd src
          # studio/ (the Tauri shell) is a workspace of its own and is built
          # on GitHub; this jail has no webkit or gtk, so a lockfile naming
          # them would only fail later and less clearly
          grep -q '^exclude = \["studio"\]' Cargo.toml || { echo "studio/ is not excluded from the workspace"; exit 1; }
          found=$(grep -E '^name = "(tauri|tauri-build|tauri-runtime|tauri-runtime-wry|wry|tao|webkit2gtk|webkit2gtk-sys|gtk|gtk-sys|gdk|javascriptcore-rs|soup3)"$' Cargo.lock || true)
          [ -z "$found" ] || { echo "the workspace's lockfile names desktop crates:"; echo "$found"; exit 1; }
          echo "no tauri, wry, tao, webkit or gtk crate among $(grep -c '^\[\[package\]\]' Cargo.lock) in Cargo.lock; studio-core is a member: $(grep -c '^name = "isolex-studio-core"$' Cargo.lock)"

      - name: formatting
        run: |
          set -o pipefail
          cd src
          rc=0
          timeout 120 cargo fmt --all --check > ../fmt.log 2>&1 || rc=$?
          if [ "$rc" = 124 ]; then echo "cargo fmt did not answer in 120s"; exit 1; fi
          [ "$rc" = 0 ] || { echo "cargo fmt --all --check rc=$rc"; head -40 ../fmt.log; exit 1; }
          echo "rustfmt had nothing to say about $(find . -name '*.rs' -not -path './target/*' | wc -l | tr -d ' ') files"

      - name: clippy, warnings are errors
        run: |
          set -o pipefail
          cd src
          rc=0
          timeout 900 cargo clippy --workspace --all-targets --locked -- -D warnings > ../clippy.log 2>&1 &&
            timeout 900 cargo clippy -p isolex-wasm --target wasm32-unknown-unknown --locked -- -D warnings >> ../clippy.log 2>&1 || rc=$?
          if [ "$rc" = 124 ]; then echo "clippy did not answer in 900s"; exit 1; fi
          [ "$rc" = 0 ] || { echo "clippy rc=$rc"; grep -E '^(error|warning)' ../clippy.log | head -20; exit 1; }
          echo "clippy checked $(grep -c 'Checking\|Compiling' ../clippy.log) crate compilations with no warning left"

      - name: the tests
        run: |
          set -o pipefail
          cd src
          rc=0
          timeout 1800 cargo test --workspace --release --locked > ../test.log 2>&1 || rc=$?
          if [ "$rc" = 124 ]; then echo "cargo test did not answer in 1800s"; exit 1; fi
          [ "$rc" = 0 ] || { echo "cargo test rc=$rc"; grep -E '^(test result|failures:|error)' ../test.log | head -20; exit 1; }
          grep -E '^test result' ../test.log | head -10
          p=$(grep -E '^test result' ../test.log | sed -n 's/.*ok\. \([0-9]*\) passed.*/\1/p' | awk '{s+=$1} END {print s+0}')
          echo "tests passed: $p"
          [ "$p" -gt 0 ] || { echo "zero tests ran, which is not a pass"; exit 1; }

      - name: the release build, for the one target this runner has
        run: |
          set -o pipefail
          cd src
          rc=0
          timeout 1800 cargo build --release --locked > ../build.log 2>&1 || rc=$?
          if [ "$rc" = 124 ]; then echo "cargo build did not answer in 1800s"; exit 1; fi
          [ "$rc" = 0 ] || { echo "cargo build rc=$rc"; grep -E '^error' ../build.log | head -20; exit 1; }
          n=0
          for f in target/release/*; do
            [ -f "$f" ] && [ -x "$f" ] || continue
            case "$f" in *.d|*.rlib|*.rmeta) continue ;; esac
            echo "$(basename "$f") $(wc -c < "$f" | tr -d ' ') bytes sha256=$(sha256 -q "$f")"
            n=$((n + 1))
          done
          echo "executables built: $n (target x86_64-unknown-freebsd, the only stdlib on this runner)"
          [ "$n" -ge 1 ] || { echo "the release build produced no executable"; exit 1; }

      - name: the WebAssembly module, which imports nothing
        run: |
          set -o pipefail
          cd src
          rc=0
          timeout 1800 cargo build --release --locked -p isolex-wasm --target wasm32-unknown-unknown > ../wasm.log 2>&1 || rc=$?
          if [ "$rc" = 124 ]; then echo "the wasm build did not answer in 1800s"; exit 1; fi
          [ "$rc" = 0 ] || { echo "the wasm build rc=$rc"; grep -E '^error' ../wasm.log | head -20; exit 1; }
          f=target/wasm32-unknown-unknown/release/isolex_wasm.wasm
          [ -f "$f" ] || { echo "the wasm build produced no module"; exit 1; }
          echo "isolex_wasm.wasm $(wc -c < "$f" | tr -d ' ') bytes sha256=$(sha256 -q "$f")"
          rc=0
          ISOLEX_WASM="$PWD/$f" timeout 600 cargo test --release --locked -p isolex-wasm --test module -- --ignored > ../module.log 2>&1 || rc=$?
          [ "$rc" = 0 ] || { echo "the module check rc=$rc"; grep -E 'panicked|left|right|error' ../module.log | head -20; exit 1; }
          grep -q '^test result: ok. 1 passed' ../module.log || { echo "the module check did not run"; tail -5 ../module.log; exit 1; }
          echo "imports: none; exports: isolex_alloc isolex_compile isolex_free isolex_version memory"

      # THE STUDIO IS CHECKED ON GITHUB, where Tauri builds (studio.yml), but
      # reviewed here, so this reports what GitHub says of the same commit.
      # It never fails the job: GitHub may not have the commit yet (the
      # mirror pushes it), or may still be running, and its outcome is
      # GitHub's to show. It asks once, with a timeout, since this jail is
      # the forge's one runner and waiting would hold it.
      - name: the studio's checks on GitHub, for this commit (reported, never failing)
        run: |
          sha=$(git -C src rev-parse HEAD 2>/dev/null) || { echo "no commit to ask about"; exit 0; }
          url="https://api.github.com/repos/axonibyte/isolex/commits/$sha/check-runs"
          code=$(timeout 30 curl -s -o gh.json -w '%{http_code}' -H 'Accept: application/vnd.github+json' "$url") || code=timeout
          if [ "$code" != 200 ]; then
            echo "GitHub did not answer for $sha ($code): not reported"
            exit 0
          fi
          if ! command -v jq > /dev/null 2>&1; then
            echo "jq is ABSENT: GitHub's answer is not read"
            exit 0
          fi
          n=$(jq '.total_count' < gh.json)
          if [ "$n" = 0 ]; then
            echo "GitHub has no checks for $sha yet: the mirror may not have pushed it"
          else
            echo "GitHub's checks for $sha:"
            jq -r '.check_runs[] | "  \(.name): \(.status)\(if .conclusion then " (" + .conclusion + ")" else "" end)"' < gh.json
          fi
          exit 0

      - name: on a tag, the tag and Cargo.toml must agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -o pipefail
          cd src
          tag="${GITHUB_REF_NAME}"
          ver=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$ver" ] || { echo "Cargo.toml declares no version"; exit 1; }
          echo "tag=$tag Cargo.toml version=$ver"
          case "$tag" in
            "$ver") echo "they agree" ;;
            *) echo "REFUSED: tag $tag is not version $ver (tags are the bare version)"; exit 1 ;;
          esac

      # THE RELEASE PATH, DRIVEN WITHOUT A TAG. Everything in the step below
      # runs only on refs/tags, so nothing exercises the token's reach or the
      # attach until a release is already under way -- which is exactly how
      # six binaries reached the package registry unlinked and nobody saw it,
      # and how the old publish step survived to 2026-10-27 holding a
      # credential that could not have worked. The same three calls here run
      # against a DRAFT release on a throwaway tag and delete it afterwards,
      # so the mechanism is provable on any manual run.
      #
      # A DRAFT ON A TAG THAT DOES NOT EXIST publishes nothing: Forgejo
      # creates the tag only when the release leaves draft, so this cannot
      # leave a tag or a visible release behind even if the delete fails.
      - name: prove the release path (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          [ -n "$RELEASE_TOKEN" ] || { echo "the job was minted no token"; exit 1; }
          command -v jq > /dev/null 2>&1 || { echo "jq is ABSENT and this step reads the forge's JSON with it. PROVISIONING finding."; exit 1; }
          api="${GITHUB_SERVER_URL:-https://forge.axonibyte.com}/api/v1/repos/${GITHUB_REPOSITORY}"
          tag="ci-selftest-${GITHUB_RUN_ID:-manual}"
          cfg=$(mktemp); chmod 600 "$cfg"
          printf 'header = "Authorization: token %s"\n' "$RELEASE_TOKEN" > "$cfg"
          trap 'rm -f "$cfg"' EXIT
          printf 'selftest\n' > selftest.txt

          payload=$(jq -nc --arg t "$tag" '{tag_name: $t, name: $t, draft: true, prerelease: true}')
          code=$(printf '%s' "$payload" | timeout 60 curl --config "$cfg" -s -o rel.json -w '%{http_code}' \
                 -X POST -H 'Content-Type: application/json' --data-binary @- "$api/releases")
          echo "CREATE -> $code"
          case "$code" in
            200 | 201) : ;;
            *) echo "the minted token CANNOT create a release"; head -c 400 rel.json; exit 1 ;;
          esac
          id=$(jq -r '.id' < rel.json)
          if [ -z "$id" ] || [ "$id" = null ]; then echo "no release id"; head -c 400 rel.json; exit 1; fi

          code=$(timeout 60 curl --config "$cfg" -s -o asset.json -w '%{http_code}' \
                 -X POST -F "attachment=@selftest.txt" "$api/releases/$id/assets?name=selftest.txt")
          echo "ATTACH -> $code"
          case "$code" in
            200 | 201) : ;;
            *) echo "the minted token CANNOT attach a release asset"; head -c 400 asset.json
               timeout 60 curl --config "$cfg" -s -o /dev/null -X DELETE "$api/releases/$id"; exit 1 ;;
          esac

          seen=$(timeout 60 curl --config "$cfg" -s "$api/releases/$id" | jq -r '[.assets[].name] | join(" ")')
          if [ "$seen" = "selftest.txt" ]; then
            echo "ASSERTED: release $tag reads back carrying exactly [$seen]"
          else
            echo "the attach reported success and the release carries [$seen]"
            timeout 60 curl --config "$cfg" -s -o /dev/null -X DELETE "$api/releases/$id"; exit 1
          fi

          # CLEANED UP, so a proof does not leave a release behind. The delete
          # is CHECKED: a self-test that quietly accumulates draft releases is
          # the kind of mess nobody notices until there are forty of them.
          gone=$(timeout 60 curl --config "$cfg" -s -o /dev/null -w '%{http_code}' -X DELETE "$api/releases/$id")
          echo "DELETE -> $gone"
          case "$gone" in
            204) : ;;
            *) echo "the draft release $tag (id $id) could NOT be deleted and is still there"; exit 1 ;;
          esac

      # THE ARTIFACTS GO TO THE RELEASE, NOT TO THE PACKAGE REGISTRY. Until
      # 2026-10-27 a tag here PUT every file into the org's GENERIC package
      # registry, so the tag a person was pointed at carried nothing they
      # could download, and the uploads sat in a registry whose repository
      # field was null -- a generic upload is owner-scoped and nothing linked
      # it back. cal's correction, 2026-10-27: "Packages are more for
      # containers or dependency stores. Releases are for human downloads."
      #
      # THE SAME CHANGE SETTLES THE CREDENTIAL. The old step authenticated as
      # a person, through an ORG-level PACKAGE_TOKEN holding agent-ibis's own
      # credential: readable by every repository in the org, broken for all of
      # them the day that account rotates, and a human's name stamped on an
      # automated upload (plumb, coop main/370). This uses the token Forgejo
      # mints per run. That token is REFUSED by the package registry -- reaper
      # task 681 drove the old path with it and got `PUT -> 401`,
      # reqPackageAccess -- and it is the same token rumor's tag-pipeline has
      # created every one of its releases with. The destination that is
      # correct is also the one that works without a person's credential.
      - name: on a tag, create the release and attach the binaries and the module
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          cd src || exit 1
          [ -n "$RELEASE_TOKEN" ] || { echo "the job was minted no token: refusing to report a publish that cannot happen"; exit 1; }
          command -v jq > /dev/null 2>&1 || { echo "jq is ABSENT and this step reads the forge's JSON with it. PROVISIONING finding, publishing nothing."; exit 1; }
          tag="${GITHUB_REF_NAME}"
          api="${GITHUB_SERVER_URL:-https://forge.axonibyte.com}/api/v1/repos/${GITHUB_REPOSITORY}"
          # The credential reaches curl through a 0600 config file and never
          # through argv: `ps` is world readable on this runner.
          cfg=$(mktemp); chmod 600 "$cfg"
          printf 'header = "Authorization: token %s"\n' "$RELEASE_TOKEN" > "$cfg"
          trap 'rm -f "$cfg"' EXIT
          crate=$(sed -n 's/^name *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          ver=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$crate" ] && [ -n "$ver" ] || { echo "Cargo.toml declares no name or no version"; exit 1; }

          # STAGED UNDER NAMES THAT SAY WHAT THEY ARE. Two releases' worth of
          # a bare executable are two different files with one name in the
          # reader's downloads folder, and nothing on the file itself says
          # which tag or which platform it came from.
          rm -rf ../dist && mkdir -p ../dist
          # THE COMPILER ALONE, BY NAME. The crate builds other executables
          # (battery, the test exerciser reaper runs), and a loop over
          # target/release attached them to 0.5.0 as if they shipped.
          f="target/release/$crate"
          [ -f "$f" ] && [ -x "$f" ] || { echo "the release build produced no $crate to attach"; exit 1; }
          cp "$f" "../dist/$crate-$ver-x86_64-unknown-freebsd" || exit 1
          n=1
          # The module is the same file on every platform, so its name carries
          # no target.
          cp target/wasm32-unknown-unknown/release/isolex_wasm.wasm "../dist/$crate-$ver.wasm" || exit 1
          # The license and notice go with every release (Apache-2.0 section
          # 4), so whoever takes a binary or the module from here has them.
          cp LICENSE ../dist/LICENSE || exit 1
          cp NOTICE ../dist/NOTICE || exit 1
          n=$((n + 3))
          # SHA256SUMS IS WRITTEN OUTSIDE dist AND MOVED IN. The redirection
          # is opened before the subshell changes directory, so writing it
          # straight into dist/ would create the file first and the glob would
          # then checksum the checksum file.
          (cd ../dist && sha256 -r -- *) > ../SHA256SUMS || { echo "could not checksum the staged files"; exit 1; }
          mv ../SHA256SUMS ../dist/SHA256SUMS
          echo "staged $n file(s) and SHA256SUMS:"
          cat ../dist/SHA256SUMS

          # 0.x IS A PRERELEASE, the same rule rumor's tag pipeline applies, so
          # the forge's "latest" does not advertise a version the project has
          # not promised to keep stable.
          case "$ver" in 0.*) pre=true ;; *) pre=false ;; esac
          payload=$(jq -nc --arg t "$tag" --argjson p "$pre" \
                    '{tag_name: $t, name: $t, draft: false, prerelease: $p}')
          code=$(printf '%s' "$payload" | timeout 60 curl --config "$cfg" -s -o ../rel.json -w '%{http_code}' \
                 -X POST -H 'Content-Type: application/json' --data-binary @- "$api/releases")
          case "$code" in
            200 | 201)
              id=$(jq -r '.id' < ../rel.json)
              echo "created release $tag -> id $id" ;;
            # A RE-RUN OF THE SAME TAG REACHES 409 LEGITIMATELY -- a cancelled
            # run, a retried job -- so the existing release is read back and
            # attached to rather than called a failure. It is still not an
            # overwrite: an asset that is already there makes the attach below
            # refuse, so a published file cannot be quietly replaced.
            409)
              code=$(timeout 60 curl --config "$cfg" -s -o ../rel.json -w '%{http_code}' "$api/releases/tags/$tag")
              [ "$code" = 200 ] || { echo "release $tag exists and cannot be read back: $code"; head -c 300 ../rel.json; exit 1; }
              id=$(jq -r '.id' < ../rel.json)
              echo "release $tag already exists -> id $id; attaching to it" ;;
            *)
              echo "creating the release for $tag answered $code"; head -c 300 ../rel.json; exit 1 ;;
          esac
          if [ -z "$id" ] || [ "$id" = null ]; then
            echo "the forge answered without a release id"; head -c 300 ../rel.json; exit 1
          fi

          for f in ../dist/*; do
            b=$(basename "$f")
            code=$(timeout 300 curl --config "$cfg" -s -o ../asset.log -w '%{http_code}' \
                   -X POST -F "attachment=@$f" "$api/releases/$id/assets?name=$b")
            echo "attach $b -> $code"
            case "$code" in
              200 | 201) : ;;
              *) echo "attaching $b failed"; head -c 300 ../asset.log; exit 1 ;;
            esac
          done

          # READ THE RELEASE BACK AND COMPARE THE WHOLE SET. "the POST answered
          # 201" and "the release carries these files" are different claims,
          # and only the second is what a person clicking the tag receives.
          # Binaries reached the package registry unlinked for months precisely
          # because nothing ever asserted the second one.
          code=$(timeout 60 curl --config "$cfg" -s -o ../rel2.json -w '%{http_code}' "$api/releases/$id")
          [ "$code" = 200 ] || { echo "reading release $id back answered $code"; exit 1; }
          got=$(jq -r '[.assets[].name] | sort | join(" ")' < ../rel2.json)
          want=$(cd ../dist && for g in *; do echo "$g"; done | sort | tr '\n' ' ' | sed 's/ $//')
          [ "$got" = "$want" ] || { echo "REFUSED: release $tag carries [$got] and this run attached [$want]"; exit 1; }
          echo "asserted: release $tag carries exactly $((n + 1)) asset(s): $got"

          # ANONYMOUS READ-BACK OF ONE BYTE STREAM, because the assert above is
          # the forge agreeing with itself about names. This is the download a
          # person actually performs, and it is checked against the file that
          # was built.
          first=$(jq -r '[.assets[] | select(.name != "SHA256SUMS")] | sort_by(.name) | .[0].browser_download_url' < ../rel2.json)
          fname=$(basename "$first")
          got=$(timeout 300 curl -sS -L -o "../fetched-$fname" -w '%{http_code}' "$first")
          [ "$got" = 200 ] || { echo "downloading $fname anonymously answered $got"; exit 1; }
          cmp -s "../dist/$fname" "../fetched-$fname" || { echo "the served asset is not the file this run built"; exit 1; }
          echo "read back anonymously -> $got, $fname byte-identical to the build"

  # THE STUDIO'S INSTALLERS, ATTACHED BY THIS FORGE, NOT PUSHED TO IT. Tauri
  # does not build in this jail, so GitHub builds them on the same tag, once
  # the push mirror carries it there (.github/workflows/studio-release.yml),
  # and leaves them as one artifact, studio-installers, with
  # SHA256SUMS-studio inside. This job waits for that run, downloads the
  # artifact, checks every file against the sums, and attaches them to the
  # release the build job made, with the token Forgejo mints per run: GitHub
  # holds no credential for the forge. Downloading an artifact needs a
  # GitHub token even from a public repository, so the forge holds one,
  # GH_ARTIFACTS_TOKEN: a fine-grained token with read-only access to public
  # repositories and nothing else.
  #
  # IT HOLDS THE RUNNER WHILE IT WAITS: up to ~15 minutes for the mirror and
  # the build's own hour, polled a minute apart. That is the price of the
  # forge publishing everything itself, and it is paid once per release.
  studio:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: freebsd-15-jail
    timeout-minutes: 120
    steps:
      - name: on a tag, wait for GitHub's studio build, and attach its installers
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_ARTIFACTS_TOKEN }}
        run: |
          set -o pipefail
          [ -n "$RELEASE_TOKEN" ] || { echo "the job was minted no token: nothing can be attached"; exit 1; }
          [ -n "$GH_TOKEN" ] || { echo "GH_ARTIFACTS_TOKEN is not set: GitHub's artifact cannot be downloaded"; exit 1; }
          command -v jq > /dev/null 2>&1 || { echo "jq is ABSENT and this step reads JSON with it. PROVISIONING finding."; exit 1; }
          tag="${GITHUB_REF_NAME}"
          forge="${GITHUB_SERVER_URL:-https://forge.axonibyte.com}"
          api="$forge/api/v1/repos/${GITHUB_REPOSITORY}"
          gh="https://api.github.com/repos/axonibyte/isolex"
          # Both credentials reach curl through 0600 config files, never argv.
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          fcfg="$work/forge.cfg"
          gcfg="$work/github.cfg"
          (
            umask 077
            printf 'header = "Authorization: token %s"\n' "$RELEASE_TOKEN" > "$fcfg"
            printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" > "$gcfg"
            printf 'header = "Accept: application/vnd.github+json"\n' >> "$gcfg"
            printf 'header = "X-GitHub-Api-Version: 2022-11-28"\n' >> "$gcfg"
          )

          # THE COMMIT THE TAG NAMES, peeled: GitHub's runs are keyed by
          # commit, and an annotated tag's own object is not one.
          remote="$forge/${GITHUB_REPOSITORY}.git"
          sha=$(timeout 60 git ls-remote "$remote" "refs/tags/$tag^{}" | cut -f1)
          [ -n "$sha" ] || sha=$(timeout 60 git ls-remote "$remote" "refs/tags/$tag" | cut -f1)
          [ -n "$sha" ] || { echo "the forge does not know tag $tag"; exit 1; }
          echo "tag $tag is commit $sha"

          # WAIT FOR GITHUB'S RUN to appear (the mirror) and to finish (the
          # build), a minute apart, for up to 100 minutes. The newest run of
          # the commit wins, so a re-run on GitHub is what gets attached.
          run=""
          status=""
          conclusion=""
          i=0
          while [ "$i" -lt 100 ]; do
            i=$((i + 1))
            code=$(timeout 60 curl --config "$gcfg" -s -o "$work/runs.json" -w '%{http_code}' \
                   "$gh/actions/workflows/studio-release.yml/runs?head_sha=$sha&event=push&per_page=5") || code=timeout
            if [ "$code" = 200 ] && [ "$(jq '.total_count' < "$work/runs.json")" -gt 0 ]; then
              run=$(jq -r '.workflow_runs[0].id' < "$work/runs.json")
              status=$(jq -r '.workflow_runs[0].status' < "$work/runs.json")
              conclusion=$(jq -r '.workflow_runs[0].conclusion // ""' < "$work/runs.json")
              [ "$status" = completed ] && break
              echo "GitHub run $run is $status, minute $i of 100"
            else
              echo "GitHub has no studio-release run for $sha yet ($code), minute $i of 100"
            fi
            sleep 60
          done
          [ "$status" = completed ] || { echo "GitHub's studio build did not finish in 100 minutes ${run:+(run $run)}"; exit 1; }
          [ "$conclusion" = success ] || { echo "GitHub's studio build ended $conclusion: https://github.com/axonibyte/isolex/actions/runs/$run"; exit 1; }
          echo "GitHub run $run: success"

          code=$(timeout 60 curl --config "$gcfg" -s -o "$work/artifacts.json" -w '%{http_code}' \
                 "$gh/actions/runs/$run/artifacts?name=studio-installers")
          [ "$code" = 200 ] || { echo "listing run $run's artifacts answered $code"; exit 1; }
          url=$(jq -r '[.artifacts[] | select(.name == "studio-installers" and .expired == false)][0].archive_download_url // ""' < "$work/artifacts.json")
          [ -n "$url" ] || { echo "run $run left no studio-installers artifact"; exit 1; }
          code=$(timeout 900 curl --config "$gcfg" -s -L -o "$work/studio.zip" -w '%{http_code}' "$url") || code=timeout
          [ "$code" = 200 ] || { echo "downloading studio-installers answered $code"; exit 1; }
          mkdir "$work/dist"
          tar -xf "$work/studio.zip" -C "$work/dist" || { echo "studio-installers is not a readable zip"; exit 1; }

          # EVERY FILE AGAINST THE SUMS GITHUB WROTE, and the sums against
          # every file: nothing unlisted is attached, nothing listed missing.
          cd "$work/dist" || exit 1
          [ -f SHA256SUMS-studio ] || { echo "the artifact carries no SHA256SUMS-studio"; exit 1; }
          n=0
          while read -r want name; do
            name="${name#\*}"
            [ -f "$name" ] || { echo "SHA256SUMS-studio lists $name, which the artifact lacks"; exit 1; }
            [ "$(sha256 -q "$name")" = "$want" ] || { echo "$name does not match SHA256SUMS-studio"; exit 1; }
            n=$((n + 1))
          done < SHA256SUMS-studio
          files=$(ls | grep -cvxF SHA256SUMS-studio)
          [ "$n" -ge 1 ] && [ "$n" = "$files" ] || { echo "SHA256SUMS-studio lists $n file(s) and the artifact holds $files"; exit 1; }
          echo "checked $n installer(s) against SHA256SUMS-studio"

          # THE RELEASE THE BUILD JOB MADE. A re-run attaches what is missing
          # and never replaces a file already published.
          code=$(timeout 60 curl --config "$fcfg" -s -o "$work/rel.json" -w '%{http_code}' "$api/releases/tags/$tag")
          [ "$code" = 200 ] || { echo "reading release $tag answered $code"; exit 1; }
          id=$(jq -r '.id' < "$work/rel.json")
          have=$(jq -r '.assets[].name' < "$work/rel.json")
          for f in *; do
            if printf '%s\n' "$have" | grep -qxF "$f"; then
              echo "already attached: $f"
              continue
            fi
            code=$(timeout 900 curl --config "$fcfg" -s -o "$work/asset.log" -w '%{http_code}' \
                   -X POST -F "attachment=@$f" "$api/releases/$id/assets?name=$f") || code=timeout
            echo "attach $f -> $code"
            case "$code" in
              200 | 201) : ;;
              *) echo "attaching $f failed"; head -c 300 "$work/asset.log"; exit 1 ;;
            esac
          done

          # READ BACK: the release carries every file, and one installer
          # downloads anonymously byte-identical to what GitHub built.
          code=$(timeout 60 curl --config "$fcfg" -s -o "$work/rel2.json" -w '%{http_code}' "$api/releases/$id")
          [ "$code" = 200 ] || { echo "reading release $id back answered $code"; exit 1; }
          for f in *; do
            jq -e --arg f "$f" 'any(.assets[]; .name == $f)' < "$work/rel2.json" > /dev/null \
              || { echo "REFUSED: release $tag does not carry $f"; exit 1; }
          done
          first=$(ls | grep -vxF SHA256SUMS-studio | head -1)
          dl=$(jq -r --arg f "$first" '.assets[] | select(.name == $f) | .browser_download_url' < "$work/rel2.json")
          code=$(timeout 900 curl -sS -L -o "$work/fetched" -w '%{http_code}' "$dl")
          [ "$code" = 200 ] || { echo "downloading $first anonymously answered $code"; exit 1; }
          cmp -s "$first" "$work/fetched" || { echo "the served $first is not the file GitHub built"; exit 1; }
          echo "asserted: release $tag carries the studio's $n installer(s) and SHA256SUMS-studio; $first read back byte-identical"
