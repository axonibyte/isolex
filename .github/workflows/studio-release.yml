# isolex studio's installers, on a studio tag (#74): built here, where
# the desktop targets are, and collected as one artifact,
# studio-installers, with LICENSE, NOTICE and SHA256SUMS-studio.
# Releases live on the forge, and its own CI makes the studio's: on the
# same tag it waits for this run, downloads the artifact, checks it, and
# releases it (.forgejo/workflows/ci.yml). This only builds, and holds no
# credential for the forge.
#
# The installers are unsigned: AppImage and deb for Linux, msi and NSIS
# setup for Windows, and a universal dmg for macOS. Each is named for the
# studio's version and its platform.
name: studio-release

on:
  push:
    # studio-<version>, as the forge tags the studio: studio-0.2.0. The
    # compiler's bare tags (0.6.0) release the compiler alone.
    tags: ['studio-*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            bundles: appimage,deb
            target: ''
          - os: windows-2025
            platform: windows-x86_64
            bundles: msi,nsis
            target: ''
          - os: macos-15
            platform: macos-universal
            bundles: dmg
            target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: studio
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # before an hour of building: the installers are named from
      # tauri.conf.json, and the tag must be the version they carry
      - name: the tag is studio-<the studio's version>
        run: |
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$GITHUB_REF_NAME" = "studio-$ver" ] || { echo "REFUSED: tag $GITHUB_REF_NAME is not studio-$ver"; exit 1; }
          echo "tag $GITHUB_REF_NAME: studio $ver"

      - name: the webview's libraries, as Tauri 2 needs them on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          # both of a universal binary's halves, on macOS
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: the interface's dependencies, from the lockfile
        run: npm ci

      - name: the installers
        env:
          # the AppImage tools run without FUSE on the runner
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -o pipefail
          args=(--bundles "${{ matrix.bundles }}")
          [ -n "${{ matrix.target }}" ] && args+=(--target "${{ matrix.target }}")
          npm run tauri -- build "${args[@]}"

      - name: named for the version and the platform
        run: |
          set -o pipefail
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ -n "$ver" ] || { echo "tauri.conf.json declares no version"; exit 1; }
          out="$RUNNER_TEMP/installers"
          mkdir -p "$out"
          n=0
          while IFS= read -r f; do
            case "$f" in
              *.AppImage) ext=AppImage ;;
              *.deb) ext=deb ;;
              *.msi) ext=msi ;;
              *-setup.exe) ext=setup.exe ;;
              *.dmg) ext=dmg ;;
              *) continue ;;
            esac
            cp "$f" "$out/isolex-studio-$ver-${{ matrix.platform }}.$ext"
            n=$((n + 1))
          done < <(find src-tauri/target -path '*/release/bundle/*' -type f)
          [ "$n" -ge 1 ] || { echo "the build made no installer"; exit 1; }
          ls -l "$out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}
          path: ${{ runner.temp }}/installers/*
          if-no-files-found: error

  # one artifact for the forge to download, its checksums inside it
  collect:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # the license and notice go with every release (Apache-2.0 section
      # 4), checksummed with the installers
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            LICENSE
            NOTICE
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: checksummed
        working-directory: dist
        run: |
          set -o pipefail
          cp ../LICENSE ../NOTICE .
          sha256sum -- * > ../SHA256SUMS-studio
          mv ../SHA256SUMS-studio .
          cat SHA256SUMS-studio

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-installers
          path: dist/*
          if-no-files-found: error
          # the forge downloads it within the hour; a week is room for a re-run
          retention-days: 7
