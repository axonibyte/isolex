# Pinned rather than :latest so a tag build today and a rebuild next year
# use the same compiler. Bump deliberately, together with rust-version in
# Cargo.toml.
image: rust:1.97

definitions:
  caches:
    cargo:
      key:
        files:
          - Cargo.lock
      path: .cargo_cache

  steps:
    - step: &doMirror
        name: Mirror repository
        clone:
          enabled: false
        script:
          - git clone --mirror git@bitbucket.org:${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}.git
          - cd ${BITBUCKET_REPO_SLUG}.git
          - git push --mirror git@github.com:${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}.git

    - step: &doFetchAndTest
        name: Fetch dependencies, lint and run tests
        caches:
          - cargo
        script:
          - export CARGO_HOME="$BITBUCKET_CLONE_DIR/.cargo_cache"
          - rustup component add rustfmt clippy
          - cargo fetch --locked
          # The repository is kept fmt-clean and clippy-clean; the gate is
          # what keeps it that way.
          - cargo fmt --check
          - cargo clippy --all-targets --locked -- -D warnings
          - cargo test --release --locked

pipelines:
  branches:
    main:
      - step: *doMirror
      - step: *doFetchAndTest

    '{feature/**,bugfix/**,release/**,hotfix/**}':
      - step: *doMirror
      - step: *doFetchAndTest

    '**':
      - step: *doMirror

  tags:
    '**':
      - step: *doMirror
      - step: *doFetchAndTest
      # Multi-target builds and the Downloads deploy land with the release
      # unit (ci/build-target.sh), mirroring ddwill's tag flow.
