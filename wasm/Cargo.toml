[package]
name = "isolex-wasm"
version = "0.6.0"
edition = "2021"
rust-version = "1.97"
description = "The isolex compiler as a WebAssembly module: JSON in, JSON out, nothing imported."
authors = ["Axonibyte Innovations, LLC"]
license = "Apache-2.0"
repository = "https://github.com/axonibyte/isolex"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# without font-tools: the module is the compiler alone
isolex = { path = "..", default-features = false }
